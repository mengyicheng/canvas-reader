[package]
name = "canvas_reader_mvp"
version = "0.2.0"
description = "无限画布 AI 阅读软件 MVP"
authors = ["小安"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = true
